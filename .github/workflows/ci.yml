name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Create personal macOS installer
        run: |
          mkdir -p release/currency-exchange-cny
          cp -R assets src release/currency-exchange-cny/
          cp .eslintrc.json .prettierrc CHANGELOG.md LICENSE README.md package.json package-lock.json raycast-env.d.ts tsconfig.json release/currency-exchange-cny/
          cp scripts/install.command release/currency-exchange-cny/install.command
          chmod +x release/currency-exchange-cny/install.command
          cd release
          zip -r currency-exchange-cny-macos.zip currency-exchange-cny
      - name: Upload personal macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: currency-exchange-cny-macos-installer
          path: release/currency-exchange-cny-macos.zip
          if-no-files-found: error
